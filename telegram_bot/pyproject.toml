[project]
name = "nexora-telegram-bot"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = ["aiogram>=3.26,<4", "httpx>=0.28,<1", "python-dotenv>=1.0,<2", "aiohttp-socks>=0.10,<1", "fastapi>=0.115,<1", "psycopg[binary]>=3.2,<4", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
