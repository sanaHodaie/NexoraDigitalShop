[project]
name = "nexora-agent"
version = "0.1.0"
description = "Persian shopping assistant agent for Nexora Digital Shop"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["nexora_agent"]
